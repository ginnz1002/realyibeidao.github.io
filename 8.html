<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发财暴富</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f8e8e8;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://img.zcool.cn/community/01e6ea5d15c2cfa8012187f4a8c9f1.jpg@1280w_1l_2o_100sh.jpg');
            background-size: cover;
            background-position: center;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }
        
        h1 {
            color: #e74c3c;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        p {
            color: #333;
            font-size: 1.5em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .money-symbol {
            font-size: 4em;
            color: #f1c40f;
            animation: bounce 1s infinite alternate;
            margin: 20px 0;
        }
        
        .firecracker {
            font-size: 2em;
            margin: 0 5px;
        }
        
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
        
        .signature {
            font-style: italic;
            color: #7f8c8d;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <span class="firecracker">🧨</span>
            <span class="firecracker">🎇</span>
            <span class="firecracker">🧨</span>
        </div>
        
        <h1>恭喜发财</h1>
        
        <div class="money-symbol">💰</div>
        
        <p>4月最后一天：<br>
           祝大家考试不挂科，<br>
           带薪摸鱼不被抓，<br>
           “辛”想事成，八八就是发！</p>
        
        <div class="money-symbol">💵</div>
        
        <p>愿财富如徐明浩的代言一样接踵而至，<br>
           好运像徐明浩的人气一样火上加火！</p>
        <br>
<br>
<image src="88.jpg" width="200px" hight="150px" border="3px">
<br>

        <div>
            <span class="firecracker">🎆</span>
            <span class="firecracker">🧨</span>
            <span class="firecracker">🎆</span>
        </div>
        
        <div class="signature">—— 
        二锅头</div>
    </div>
</body>
</html>
